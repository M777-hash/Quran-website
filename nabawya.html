            <h2 class="azkar-sabah">  احاديث نبوية 
                  <i class="fas fa-book-open"></i>
            </h2>

            <button>عَنْ أَبِي هُرَيْرَةَ ـ رضي الله عنه ـ  قَاْلَ: قَالَ رَسُولُ اللهِ صلى الله عليه وسلم: ” مَنْ كَانَتْ عِنْدَهُ مَظْلمَةٌ لِأَخِيهِ فَلْيَتَحَلَّلْهُ مِنْهَا، فَإِنَّهُ لَيْسَ ثَمَّ دِينَارٌ وَلَا دِرْهَمٌ مِنْ قَبْلِ أَنْ يُؤْخَذَ لِأَخِيهِ مِنْ حَسَنَاتِهِ، فَإِنْ لَمْ يَكُنْ لَهُ حَسَنَاتٌ أُخِذَ مِنْ سَيِّئَاتِ أَخِيهِ، فَطُرِحَتْ عَلَيْهِ “. [ البخاري: 6082 ]</button> 
            <button>عِنْ أَبي هُرَيْرَةَ ـ رضي الله عنه ـ  قَاْلَ: قَالَ رَسُولُ اللهِِ  صلى الله عليه وسلم :  بِحَسْبِ امْرِئٍ مِنَ الشَّرِّ أَنْ يَحْقِرَ أَخَاهُ المُسْلِمَ، كُلُّ المُسْلِمِ عَلَى المُسْلِمِ، حَرَامٌ دَمُهُ، وَمَالُهُ، وَعِرْضُهُ “. [ مسلم: 4657]</button>
           <button>عَنْ جَاْبِر بْنِ عَبْدِ الله ـ رضي الله عنهما ـ قَاْلَ: قَالَ رَسُولُ اللهِِ  صلى الله عليه وسلم : ” اتَّقُوا الظُّلْمَ ، فَإِنَّ الظُّلْمَ ظُلُمَاتٌ يَوْمَ الْقِيَامَةِ، وَاتَّقُوا الشُّحَّ، فَإِنَّ الشُّحَّ أَهْلَكَ مَنْ كَانَ قَبْلَكُمْ، حَمَلَهُمْ عَلَى أَنْ سَفَكُوا دِمَاءَهُمْ وَاسْتَحَلُّوا مَحَارِمَهُمْ ” . [ مسلم:4682]</button>
           <button>عِنْ أَبي هُرَيْرَةَ ـ رضي الله عنه ـ قَاْلَ: قَالَ رَسُولُ الله  صلى الله عليه وسلم : ” لَا تَدْخُلُونَ الجَنَّةَ حَتَّى تُؤْمِنُوا، وَلَا تُؤْمِنُوا حَتَّى تَحَابُّوا أَوَلَا  أَدُلُّكُمْ عَلَى شَيْءٍ إِذَا فَعَلْتُمُوهُ تَحَابَبْتُمْ، أَفْشُوا السَّلَامَ بَيْنَكُمْ “. [ مسلم:84]</button>
           <button>عَنْ عَائِشَةَ ـ رضي الله عنها ـ قَالَتْ : قَالَ النَّبِيُّ  صلى الله عليه وسلم: ” لَا تَسُبُّوا الْأَمْوَاتَ، فَإِنَّهُمْ قَدْ أَفْضَوْا إِلَى مَا قَدَّمُوا “. [ البخاري: 6064]</button>
           
           <button>عِنْ عַيَض بن حيمار ـ رضي الله عنه ـ قَاْلَ: قاعدة رسل الله  صلى الله عليه وسلم :  “إنه الله أوحى إلي أن تواضعوا حتى لا يفخر أحد على أحد، ولا يبغ أحد على أحد“. [ مسلم: 5114]</button>
           <button>عَنْ أبي سَعِيْدٍ الخُدْريِّ ـ رضي الله عنه ـ قَاْلَ: قَالَ رَسُولُ اللهِِ  صلى الله عليه وسلم : “ إِيَّاكُمْ وَالجُلُوسَ بِالطُّرُقَاتِ “، فَقَالُوا : يَا رَسُولَ اللهِ، مَا لَنَا مِنْ مَجَالِسِنَا بُدٌّ نَتَحَدَّثُ فِيهَا، فَقَالَ : ” إِذْ أَبَيْتُمْ إِلَّا المَجْلِسَ، فَأَعْطُوا الطَّرِيقَ حَقَّهُ “، قَالُوا : وَمَا حَقُّ الطَّرِيقِ يَا رَسُولَ اللهِ ؟ قَالَ : ” غَضُّ الْبَصَرِ، وَكَفُّ الْأَذَى، وَرَدُّ السَّلَامِ، وَالْأَمْرُ بِالمَعْرُوفِ، وَالنَّهْيُ عَنِ المُنْكَرِ “. [متفق عليه: 5790 ، 3967]</button>
           <button>عِنْ أَبي هُرَيْرَةَ ـ رضي الله عنه ـ  قَاْلَ: قَالَ رَسُولُ اللهِِ  صلى الله عليه وسلم :” مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ، وَمَا زَادَ اللهُ عَبْدًا بِعَفْوٍ إِلَّا عِزًّا، وَمَا تَوَاضَعَ أَحَدٌ لِلهِِ إِلَّا رَفَعَهُ اللهُ “.  [ مسلم: 4696]</button>
           <button>عِنْ أَبي هُرَيْرَةَ ـ رضي الله عنه ـ  قَاْلَ: قَالَ رَسُولُ اللهِِ  صلى الله عليه وسلم : ” مَا مِنْ يَوْمٍ يُصْبِحُ الْعِبَادُ فِيهِ إِلَّا مَلَكَانِ يَنْزِلَانِ فَيَقُولُ أَحَدُهُمَا : اللَّهُمَّ أَعْطِ مُنْفِقًا خَلَفًا، وَيَقُولُ الْآخَرُ : اللَّهُمَّ أَعْطِ مُمْسِكًا تَلَفًا “.
[متفق عليه: 1357 ، 1684]</button>
           <button>عَنْ أَنَسِ بْنِ مَالِكٍ ـ رضي الله عنه ـ  قَاْلَ: قَالَ رَسُولُ اللهِِ  صلى الله عليه وسلم :” مَنْ سَرَّهُ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ، وَ يُنْسَأَ لَهُ فِي أَثَرِهِ، فَلْيَصِلْ رَحِمَهُ “. [متفق عليه: 1936 ، 4645]</button>
           <button>عِنْ أَبي هُرَيْرَةَ ـ رضي الله عنه ـ  قَاْلَ: قَالَ رَسُولُ اللهِِ  صلى الله عليه وسلم : ” مَنْ دَعَا إِلَى هُدًى كَانَ لَهُ مِنَ الْأَجْرِ مِثْلُ أُجُورِ مَنْ تَبِعَهُ، لَا يَنْقُصُ ذَلِكَ مِنْ أُجُورِهِمْ شَيْئًا، وَمَنْ دَعَا إِلَى ضَلَالَةٍ كَانَ عَلَيْهِ مِنَ الْإِثْمِ مِثْلُ آثَامِ مَنْ تَبِعَهُ، لَا يَنْقُصُ ذَلِكَ مِنْ آثَامِهِمْ شَيْئًا“.[مسلم:4838]</button>
           <button>عِنْ أَبي هُرَيْرَةَ ـ رضي الله عنه ـ  أَنَّ رَجُلًا قَالَ لِلنَّبِيِّ ـ صلى الله عليه وسلم ـ أَوْصِنِي، قَالَ : ” لَا تَغْضَبْ ” فَرَدَّدَ مِرَارًا، قَالَ : ” لَا تَغْضَبْ “. [  البخاري: 5680]</button>
           <button>عَنِ الزُّبَيْرِ بْنِ الْعَوَّامِ ـ رضي الله عنه ـ  قَاْلَ: قَالَ رَسُولُ اللهِِ  صلى الله عليه وسلم : ” لَأَنْ يَحْتَزِمَ أَحَدُكُمْ حُزْمَةً مِنْ حَطَبٍ ، فَيَحْمِلَهَا عَلَى ظَهْرِهِ فَيَبِيعَهَا، خَيْرٌ لَهُ مِنْ أَنْ يَسْأَلَ رَجُلًا يُعْطِيهِ أَوْ يَمْنَعُهُ ” [متفق عليه: 2212 ، 1735]</button>
           <button>عَنْ المُغِيرَةِ  ـ رضي الله عنه ـ  قَاْلَ: قَالَ رَسُولُ اللهِِ  صلى الله عليه وسلم :” إِنَّ كَذِبًا عَلَيَّ لَيْسَ كَكَذِبٍ عَلَى أَحَدٍ، مَنْ كَذَبَ عَلَيَّ مُتَعَمِّدًا ، فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ“. [ متفق عليه: 1216 ، 5]</button>
           <button>عِنْ أَبي هُرَيْرَةَ ـ رضي الله عنه ـ قَاْلَ: قَالَ رَسُولُ اللهِِ صلى الله عليه وسلم : ” تُنْكَحُ المَرْأَةُ لِأَرْبَعٍ : لِمَالِهَا، وَلِحَسَبِهَا، وَجَمَالِهَا، وَلِدِينِهَا، فَاظْفَرْ بِذَاتِ الدِّينِ تَرِبَتْ يَدَاكَ“.[ متفق عليه: 4727 ، 2669]</button>
