            <h2 class="azkar-sabah">  اسالة واجوبة دينية
                <i class="fas fa-question-circle"></i>
            </h2>

            <button><h3> ما الفرق بين التوكل على الله والتواكل؟</h3> التوكل هو اعتماد القلب على الله مع الأخذ بالأسباب المشروعة، أما التواكل فهو ترك الأسباب بحجة الاعتماد على الله، وهذا ليس من حقيقة التوكل      </button>
            <button><h3>ما الفرق بين حسن الظن بالله والاغترار برحمته؟</h3> حسن الظن بالله يدفع المسلم إلى الرجاء والعمل الصالح والتوبة، أما الاغترار بالرحمة فهو الاستمرار في المعصية مع الإصرار عليها دون توبة، اعتمادًا على المغفرة </button>
            <button><h3>هل الإيمان يزيد وينقص؟</h3>   نعم، يزيد الإيمان بالطاعة والعلم النافع والعمل الصالح، وينقص بالمعصية والغفلة   </button>
            <button><h3>لماذا يبتلي الله الإنسان وهو سبحانه يعلم ما سيحدث له؟</h3>يبتلي الله عباده لحِكَم، منها إظهار الصبر والعمل، ورفع الدرجات، وتكفير السيئات، وتمييز الصادق في إيمانه</button>
            <button><h3>ما الفرق بين التفسير والتدبر؟</h3>التفسير هو بيان معاني الآيات بالاعتماد على اللغة والسياق وأقوال أهل العلم، أما التدبر فهو التأمل في معاني القرآن وهداياته للعمل بها</button>
            <button><h3>لماذا نزل القرآن الكريم مفرّقًا ولم ينزل كاملًا مرة واحدة؟</h3>من حِكَم نزوله مفرّقًا تثبيت قلب النبي ﷺ، وتيسير حفظه وفهمه، ومواكبة الأحداث، والتدرج في تربية المجتمع </button> 
            <button><h3>ما الفرق بين السور المكية والمدنية؟</h3>المكي هو ما نزل قبل الهجرة، والمدني هو ما نزل بعدها، بصرف النظر عن مكان النزول</button>
            <button><h3>ماذا يفعل المسلم إذا أذنب؟</h3>يتوب إلى الله توبة صادقة، ويندم على الذنب، ويقلع عنه، ويعزم على عدم العودة إليه، ويرد الحقوق إلى أصحابها إذا تعلّق الذنب بحقوق العباد</button>
            <button><h3>هل يمكن أن يقبل الله توبة شخص كرر الذنب مرات كثيرة؟</h3>نعم، باب التوبة مفتوح ما لم يصل الإنسان إلى وقت لا تُقبل فيه التوبة شرعًا، ويجب أن تكون توبته صادقة في كل مرة، وألا يجعل التوبة وسيلة للإصرار المتعمد على المعصية</button>
            <button><h3>هل الحزن عند المصائب يتعارض مع الإيمان؟</h3>لا، فالحزن شعور إنساني طبيعي. وقد بكى النبي ﷺ عند وفاة ابنه إبراهيم، وبيّن أن العين تدمع والقلب يحزن، مع عدم قول ما يغضب الله</button>
            <button><h3>كيف يوازن المسلم بين الخوف من الله والرجاء في رحمته؟</h3>يخاف من عقاب الله فيبتعد عن المعاصي، ويرجو رحمته فيحسن الظن به ويجتهد في الطاعة والتوبة، فلا يقنط من رحمته ولا يأمن مكره</button>
            <button><h3>هل كل اختلاف بين العلماء يعني أن أحدهم مخطئ أو متساهل؟</h3>ا، فقد ينشأ الاختلاف من تفاوت فهم الأدلة، أو اختلاف ثبوت الحديث، أو اختلاف دلالة النصوص وقواعد الاستنباط. لكن ليست كل الآراء صحيحة بالضرورة، وتُدرس المسائل بأدلتها وضوابطها</button>
            <button><h3>ما الفرق بين الغيبة والنميمة؟</h3>لغيبة هي ذكر الإنسان بما يكره في غيبته إذا كان ذلك فيه، أما النميمة فهي نقل الكلام بين الناس على وجه يفسد العلاقات بينهم</button>
            <button><h3>هل يجوز رد الإساءة بالإساءة؟</h3>لأصل أن المسلم لا يتعدى حدود الشرع في رد الإساءة، وله حق المطالبة بحقه بالعدل، والعفو أفضل في مواضع كثيرة إذا ترتبت عليه مصلحة، قال تعالى: ﴿وَجَزَاءُ سَيِّئَةٍ سَيِّئَةٌ مِثْلُهَا فَمَنْ عَفَا وَأَصْلَحَ فَأَجْرُهُ عَلَى اللَّهِ﴾ [الشورى: 40].</button>
            <button><h3>ما المقصود بالإحسان إلى الوالدين، وهل يقتصر على طاعتهما؟</h3>لإحسان يشمل حسن الصحبة والقول الكريم والرعاية والبر والدعاء، وليس معناه طاعتهما في معصية الله؛ فلا طاعة لمخلوق في معصية الخالق</button>
            <button><h3>كيف يعرف المسلم أن عمله خالص لله؟</h3>يجاهد نفسه ليكون قصده رضا الله لا مدح الناس، ويحرص على إخفاء العمل حيث يكون الإخفاء أصلح، ولا يجعل إعجاب الناس أو ذمهم هو معيار العمل. والإخلاص عمل قلبي يحتاج إلى مجاهدة مستمرة</button>
            <button><h3>ما الحكمة من أن يستجيب الله لبعض الدعوات ولا تتحقق للإنسان بالصورة التي طلبها؟</h3>قد يعطي الله العبد ما سأله، أو يصرف عنه من السوء، أو يدّخر له الأجر في الآخرة، كما ورد في الحديث عن الدعاء. ولا يستطيع الإنسان الجزم بالحكمة المحددة وراء عدم تحقق دعاء بعينه</button>
            <button><h3>هل صلاح الإنسان يعني أنه لن يتعرض للفتن والمصائب؟</h3>لا، فالابتلاء قد يقع للصالح وغيره، وقد ابتُلي الأنبياء وهم أفضل الناس. قال النبي ﷺ عندما سُئل عن أشد الناس بلاءً: «الأنبياء، ثم الأمثل فالأمثل» رواه الترمذي</button>
            <button><h3>ما الدعاء الذي يُقال عند دخول المسجد؟</h3>من الأدعية الواردة: «اللهم افتح لي أبواب رحمتك»، رواه مسلم</button>
            <button><h3>لماذا جعل الله التفاضل بين الناس بالتقوى وليس بالمال أو النسب؟</h3>أن قيمة الإنسان عند الله لا تُقاس بما يملكه أو بمن ينتمي إليه، وإنما بإيمانه وتقواه وعمله الصالح. قال تعالى: ﴿إِنَّ أَكْرَمَكُمْ عِنْدَ اللَّهِ أَتْقَاكُمْ﴾ [الحجرات: 13]</button>
